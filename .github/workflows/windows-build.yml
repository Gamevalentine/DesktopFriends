name: Windows Build

on:
  push:
    branches:
      - windows-support
      - live2d-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm build:packages

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Run Windows Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Build Windows desktop app
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Smoke launch Windows executable
        shell: pwsh
        run: |
          $exe = "apps/desktop/src-tauri/target/release/tablefri.exe"
          if (!(Test-Path $exe)) {
            throw "Windows executable was not produced: $exe"
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited) {
            throw "TableFri exited during startup smoke test with code $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force

      - name: Verify Windows installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $exe = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue

          if (!$msi) { throw "MSI installer was not produced" }
          if (!$exe) { throw "NSIS setup EXE was not produced" }

          Write-Host "MSI: $($msi.FullName)"
          Write-Host "EXE: $($exe.FullName)"

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: TableFri-Windows
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
